services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openclip
      POSTGRES_PASSWORD: openclip
      POSTGRES_DB: openclip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclip -d openclip"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU: uncomment on NVIDIA hosts with nvidia-container-toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    working_dir: /app/backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://openclip:openclip@postgres:5432/openclip
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_ROOT: /data/storage
      OLLAMA_BASE_URL: http://ollama:11434
      CONFIG_PATH: /app/config.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./config.yaml:/app/config.yaml:ro
      - ./storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=INFO --concurrency=1
    working_dir: /app/backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://openclip:openclip@postgres:5432/openclip
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_ROOT: /data/storage
      OLLAMA_BASE_URL: http://ollama:11434
      CONFIG_PATH: /app/config.yaml
      MAX_CONCURRENT_GPU_JOBS: "1"
    volumes:
      - ./backend:/app/backend
      - ./config.yaml:/app/config.yaml:ro
      - ./storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # frontend: deferred until Phase 8

volumes:
  postgres_data:
  redis_data:
  ollama_data:
